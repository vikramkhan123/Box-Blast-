name: Build & Sign Box Blast for Play Store

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. Play Store ke liye AAB generate karna
    - name: Build Release AAB
      run: ./gradlew bundleRelease

    # 2. Aapke lagaye gaye Secrets se app ko Sign (Lock) karna
    - name: Sign AAB
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    # 3. Final AAB file ko upload karna taaki aap download kar sako
    - name: Upload Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: BoxBlast-PlayStore-Ready
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
