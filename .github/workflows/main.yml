name: Build & Sign Box Blast for All Stores

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # Direct Gradle command (Bypass missing gradlew error)
    - name: Build Release AAB & APK
      run: gradle bundleRelease assembleRelease

    - name: Sign AAB
      id: sign_aab
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Sign APK
      id: sign_apk
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Signed AAB (Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: BoxBlast-PlayStore-AAB
        path: ${{steps.sign_aab.outputs.signedReleaseFile}}

    - name: Upload Signed APK (Free Stores)
      uses: actions/upload-artifact@v4
      with:
        name: BoxBlast-FreeStores-APK
        path: ${{steps.sign_apk.outputs.signedReleaseFile}}
