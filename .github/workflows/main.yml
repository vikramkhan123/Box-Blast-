name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew missing, generating..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK (With Memory Limits & No Lint)
        run: ./gradlew clean assembleDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g" -x lint

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
