name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository using v4
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 using v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Check and generate Gradle Wrapper if gradlew is missing
      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew file not found. Generating gradle wrapper automatically..."
            gradle wrapper
            chmod +x gradlew
          else
            echo "gradlew found. Making executable..."
            chmod +x gradlew
          fi

      # 4. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. Upload APK as Artifact using v4
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
